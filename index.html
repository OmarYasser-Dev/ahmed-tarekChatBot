<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد المنصة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-stage" aria-hidden="true">
        <div class="stage-orb stage-orb-a"></div>
        <div class="stage-orb stage-orb-b"></div>
        <div class="stage-grid"></div>
    </div>

    <main class="page-intro">
        <p class="page-kicker">المنصة التعليمية</p>
        <h1>مساعد المنصة</h1>
        <p>اسأل عن المنهج والدروس في أي وقت. اضغط الزر القرمزي للبدء.</p>
    </main>

    <div id="gomaa-chat-widget">
        <section
            id="chat-window"
            class="chat-window"
            aria-hidden="true"
        >
            <div class="window-glow" aria-hidden="true"></div>
            <div class="window-glow window-glow-b" aria-hidden="true"></div>

            <header class="chat-header">
                <div class="header-right">
                    <div class="bot-avatar">
                        <span class="avatar-ring" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 3V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <rect x="4" y="6" width="16" height="13" rx="4" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="9" cy="12" r="1" fill="currentColor"/>
                            <circle cx="15" cy="12" r="1" fill="currentColor"/>
                            <path d="M8.5 15.5C9.5 16.3 10.5 16.7 12 16.7C13.5 16.7 14.5 16.3 15.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <div class="header-text">
                        <strong>مساعد المنصة</strong>
                        <span>
                            <i class="online-dot"></i>
                           معاك في اي وقت
                        </span>
                    </div>
                </div>

                <button
                    id="close-chat"
                    class="close-chat"
                    type="button"
                    aria-label="إغلاق المحادثة"
                >
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </header>

            <main id="chat-messages" class="chat-messages">
                <div id="welcome-message" class="welcome-message">
                    <div class="welcome-icon">
                        <span class="welcome-glow" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 3V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <rect x="4" y="6" width="16" height="13" rx="4" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="9" cy="12" r="1" fill="currentColor"/>
                            <circle cx="15" cy="12" r="1" fill="currentColor"/>
                        </svg>
                    </div>
                    <h3>اسألني ي حبي</h3>
                    <p>اسألني عن المنهج أو الدروس أو أي حاجة محتاج تعرفها.</p>
                </div>
            </main>

            <div id="typing-indicator" class="typing-indicator hidden">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <footer class="chat-footer">
                <div class="input-wrapper">
                    <textarea
                        id="chat-input"
                        rows="1"
                        maxlength="3000"
                        placeholder="اكتب سؤالك هنا..."
                        aria-label="اكتب سؤالك"
                    ></textarea>

                    <button
                        id="send-message"
                        class="send-button"
                        type="button"
                        aria-label="إرسال الرسالة"
                    >
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21 3L10 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 3L14 21L10 14L3 10L21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="footer-note">مساعد المنصة الذكي</div>
            </footer>
        </section>

        <button
            id="chat-toggle"
            class="chat-toggle"
            type="button"
            aria-label="فتح المساعد"
            aria-expanded="false"
        >
            <span class="toggle-aura" aria-hidden="true"></span>
            <span class="toggle-ring" aria-hidden="true"></span>

            <span class="toggle-icon open-icon">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M20 11.5C20 16.194 16.194 20 11.5 20C9.93 20 8.47 19.58 7.2 18.84L4 20L5.15 16.72C4.42 15.47 4 14.01 4 12.5C4 7.806 7.806 4 12.5 4C16.64 4 20 7.36 20 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M8 12H8.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M12 12H12.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M16 12H16.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
            </span>

            <span class="toggle-icon close-icon">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
